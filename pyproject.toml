[project]
name = "opencode-mcp-json-consent-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "ruff",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["tests/integration.py", "tests/fixtures/fixture.py"]
exclude = "(^|/)tests/artifacts/"
