name: Check

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  check:
    name: OpenCode ${{ matrix.opencode }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        opencode: ['2.2.5', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.24'
      - run: npm ci
      - run: uv sync --locked
      - run: npm run check
      - name: Install tested OpenCode CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode-cli" --no-audit --no-fund --package-lock=false "@opencode/cli@${{ matrix.opencode }}"
          echo "$RUNNER_TEMP/opencode-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: opencode --version
      - run: npm run test:integration
      - name: Collect tested package
        if: matrix.opencode == '2.2.5'
        run: |
          set -- tests/artifacts/run-*/*.tgz
          test "$#" -eq 1
          mkdir -p dist
          cp "$1" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.opencode == '2.2.5'
        with:
          name: opencode-mcp-json-consent-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
